<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundTracks Extension - SoundCloud Dashboard</title>
    <style>
        :root {
            --soundcloud-orange: #FF5500;
            --dark-bg: #121212;
            --card-bg: #181818;
            --text-main: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-color: #282828;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .profile-title {
            color: var(--soundcloud-orange);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .track-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-item {
            background: #222;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .track-item:hover {
            background: #2a2a2a;
            border-color: #444;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .play-btn {
            background: var(--soundcloud-orange);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="profile-title">Filipe Pereira — Extensões</div>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Painel de Controlo Remoto (SoundCloud)</p>
        </div>

        <div class="track-grid">
            <div class="track-item">
                <span class="track-title">i put the new forgis</span>
                <button class="play-btn" onclick="injectTrack('https://soundcloud.com')">Injetar</button>
            </div>
            <div class="track-item">
                <span class="track-title">i want the new forgis</span>
                <button class="play-btn" onclick="injectTrack('https://soundcloud.com')">Injetar</button>
            </div>
            <div class="track-item">
                <span class="track-title">Eu comi-o (Chouriço)</span>
                <button class="play-btn" onclick="injectTrack('https://soundcloud.com')">Injetar</button>
            </div>
            <div class="track-item">
                <span class="track-title">TPOT Bfdi</span>
                <button class="play-btn" onclick="injectTrack('https://soundcloud.com')">Injetar</button>
            </div>
            <div class="track-item">
                <span class="track-title">Canção doida</span>
                <button class="play-btn" onclick="injectTrack('https://soundcloud.com')">Injetar</button>
            </div>
            <div class="track-item">
                <span class="track-title">Eu sou burro</span>
                <button class="play-btn" onclick="injectTrack('https://soundcloud.com')">Injetar</button>
            </div>
        </div>
    </div>

    <script>
        function injectTrack(url) {
            // Caso os ficheiros estejam abertos no mesmo browser (site.html aberto a partir da app principal)
            if (window.opener) {
                window.opener.postMessage({ type: 'LOAD_SOUNDCLOUD', url: url }, '*');
            } else if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'LOAD_SOUNDCLOUD', url: url }, '*');
            } else {
                // Fallback: Se estiver isolado, abre o widget oficial numa janela flutuante
                const cleanUrl = encodeURIComponent(url);
                window.open(`https://soundcloud.com{cleanUrl}&color=%23ff5500&auto_play=true`, 'SoundCloudPlayer', 'width=450,height=166');
            }
        }
    </script>
</body>
</html>
